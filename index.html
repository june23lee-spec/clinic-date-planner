<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>約診日期推算</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2D5BB8">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="約診日期推算">

<style>
  :root{
    --bg:#F4F6FA; --card:#FFFFFF; --card-2:#FAFBFD;
    --ink:#1B2430; --ink-soft:#5A6675; --ink-faint:#8C97A6;
    --line:#E4E8F0; --line-soft:#EEF1F6;
    --accent:#2D5BB8; --accent-ink:#22488F; --accent-soft:#E9EFFB;
    --good:#1C8555; --good-soft:#E4F3EC;
    --shadow:0 1px 2px rgba(20,30,50,.05),0 8px 24px rgba(20,30,50,.05);
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#12161C; --card:#1A2029; --card-2:#161C24;
      --ink:#E7ECF3; --ink-soft:#A6B1C0; --ink-faint:#6E7B8B;
      --line:#2A323D; --line-soft:#222933;
      --accent:#6E98EE; --accent-ink:#A0BDF6; --accent-soft:#20304C;
      --good:#57BE8B; --good-soft:#173026;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --bg:#F4F6FA; --card:#FFFFFF; --card-2:#FAFBFD;
    --ink:#1B2430; --ink-soft:#5A6675; --ink-faint:#8C97A6;
    --line:#E4E8F0; --line-soft:#EEF1F6;
    --accent:#2D5BB8; --accent-ink:#22488F; --accent-soft:#E9EFFB;
    --good:#1C8555; --good-soft:#E4F3EC;
    --shadow:0 1px 2px rgba(20,30,50,.05),0 8px 24px rgba(20,30,50,.05);
  }
  :root[data-theme="dark"]{
    --bg:#12161C; --card:#1A2029; --card-2:#161C24;
    --ink:#E7ECF3; --ink-soft:#A6B1C0; --ink-faint:#6E7B8B;
    --line:#2A323D; --line-soft:#222933;
    --accent:#6E98EE; --accent-ink:#A0BDF6; --accent-soft:#20304C;
    --good:#57BE8B; --good-soft:#173026;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
    min-height:100vh; padding:22px 15px 56px;
  }
  .wrap{max-width:560px;margin:0 auto}

  /* header */
  header.site{margin-bottom:18px}
  .eyebrow{font-size:11.5px;letter-spacing:.16em;color:var(--accent);font-weight:800;text-transform:uppercase;margin-bottom:7px}
  h1{font-size:25px;font-weight:800;letter-spacing:.01em;text-wrap:balance}
  .sub{color:var(--ink-soft);font-size:13.5px;margin-top:7px;max-width:46ch}

  /* card + fields */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 16px;display:flex;flex-direction:column;gap:16px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em}
  .field-hint{font-size:12px;color:var(--ink-faint)}
  input[type=number]{
    appearance:none;width:100%;font:inherit;font-size:16px;color:var(--ink);
    background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
    font-variant-numeric:tabular-nums}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  /* calendar */
  .cal{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:7px}
  .cal-head{display:flex;align-items:center;gap:4px}
  .cal-title{flex:1;text-align:center;font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums}
  .cal-nav{appearance:none;cursor:pointer;width:34px;height:34px;border:1px solid var(--line);
    background:var(--card);border-radius:9px;font:inherit;font-size:15px;font-weight:800;color:var(--ink-soft);
    display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s}
  .cal-nav:hover{border-color:var(--accent);color:var(--accent-ink)}
  .cal-nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-dow{text-align:center;font-size:11.5px;color:var(--ink-faint);font-weight:700;padding:2px 0}
  .cal-day{appearance:none;cursor:pointer;border:1.5px solid transparent;background:transparent;
    border-radius:9px;font:inherit;font-size:14.5px;font-weight:600;color:var(--ink);
    height:38px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
    transition:background .12s,border-color .12s}
  .cal-day:hover{background:var(--accent-soft)}
  .cal-day:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .cal-day.is-today{border-color:var(--accent);color:var(--accent-ink);font-weight:800}
  .cal-day.is-sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
  .cal-blank{height:38px}
  .cal-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;
    border-top:1px solid var(--line-soft);padding-top:8px;flex-wrap:wrap}
  .cal-picked{font-size:13.5px;font-weight:700;color:var(--ink-soft)}
  .cal-picked em{font-style:normal;color:var(--accent-ink);font-variant-numeric:tabular-nums}
  .today-badge{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:var(--good);
    background:var(--good-soft);border-radius:999px;padding:2px 8px;vertical-align:1px}
  .cal-today-btn{appearance:none;cursor:pointer;font:inherit;font-size:12.5px;font-weight:800;
    color:var(--accent-ink);background:var(--card);border:1px solid var(--accent);border-radius:999px;
    padding:5px 12px;transition:background .15s}
  .cal-today-btn:hover{background:var(--accent-soft)}
  .cal-today-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{appearance:none;cursor:pointer;font:inherit;text-align:left;
    background:var(--card-2);border:1px solid var(--line);border-radius:11px;
    padding:9px 12px;color:var(--ink);font-size:14px;font-weight:700;line-height:1.25;
    transition:border-color .15s,background .15s}
  .chip:hover{border-color:var(--accent)}
  .chip.is-active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip-num{display:flex;align-items:center;font-variant-numeric:tabular-nums;padding:10px 15px;font-size:14.5px}

  .field.gap-lg{gap:11px}
  .seg{display:inline-flex;align-self:flex-start;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .seg-btn{appearance:none;border:0;background:transparent;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink-soft);padding:8px 18px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s}
  .seg-btn.is-active{background:var(--accent);color:#fff}
  .seg-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .custom-inline{display:flex;align-items:center;gap:9px}
  .custom-inline .ci-label{font-size:12.5px;color:var(--ink-soft);font-weight:600;white-space:nowrap}
  .custom-inline input{max-width:96px}
  .custom-inline .ci-unit{font-size:14.5px;font-weight:700;color:var(--ink-soft)}

  .go{appearance:none;cursor:pointer;font:inherit;font-size:15px;font-weight:800;
    background:var(--accent);color:#fff;border:0;border-radius:11px;padding:13px;
    transition:filter .15s,transform .05s}
  .go:hover{filter:brightness(1.06)}
  .go:active{transform:translateY(1px)}
  .go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* result */
  .result{margin-top:14px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .result-head{padding:16px;
    background:linear-gradient(180deg,var(--accent-soft),transparent)}
  .target-label{font-size:12px;font-weight:700;color:var(--accent-ink);letter-spacing:.04em}
  .target-date{display:block;font-size:26px;font-weight:800;letter-spacing:.01em;
    margin-top:3px;font-variant-numeric:tabular-nums}
  .target-meta{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.55}

  .empty{padding:20px 16px;color:var(--ink-soft);font-size:13.5px;text-align:center}
  .empty b{color:var(--ink);font-weight:700}

  footer.foot{margin-top:22px;text-align:center;font-size:11.5px;color:var(--ink-faint);line-height:1.7}

  .sheet-link{margin-top:20px;text-align:center;font-size:13.5px;color:var(--ink-faint)}
  .sheet-link a{color:var(--accent);font-weight:700;text-decoration:none;
    border-bottom:1.5px solid var(--accent-soft);padding-bottom:1px}
  .sheet-link a:hover{border-bottom-color:var(--accent)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="site">
    <div class="eyebrow">慢箋 · 回診日推算</div>
    <h1>約診日期推算</h1>
    <p class="sub">在月曆點選處方起始日（預設今天），選下次回診間隔（週數或天數），推算預約日期。</p>
  </header>

  <div class="card">
    <div class="field gap-lg">
      <span class="field-label">處方起始日（點月曆選）</span>
      <div class="cal">
        <div class="cal-head">
          <button class="cal-nav" id="cal-prev-y" type="button" aria-label="上一年">«</button>
          <button class="cal-nav" id="cal-prev-m" type="button" aria-label="上個月">‹</button>
          <div class="cal-title" id="cal-title"></div>
          <button class="cal-nav" id="cal-next-m" type="button" aria-label="下個月">›</button>
          <button class="cal-nav" id="cal-next-y" type="button" aria-label="下一年">»</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-foot">
          <div class="cal-picked" id="cal-picked"></div>
          <button class="cal-today-btn" id="cal-today" type="button">回到今天</button>
        </div>
      </div>
      <span class="field-hint">要用別天當起點（例如上次施打日），直接在月曆點那一天；「‹ ›」換月、「« »」換年。</span>
    </div>

    <div class="field gap-lg">
      <span class="field-label">回診間隔</span>
      <div class="seg" id="refill-unit" role="group" aria-label="間隔單位">
        <button class="seg-btn is-active" data-unit="week" type="button">用週數</button>
        <button class="seg-btn" data-unit="day" type="button">用天數</button>
      </div>
      <div class="chips" id="refill-quick"></div>
      <div class="custom-inline">
        <span class="ci-label">或直接輸入</span>
        <input type="number" id="refill-num" min="1" value="12" inputmode="numeric" aria-label="間隔數字">
        <span class="ci-unit" id="refill-unit-suffix">週</span>
      </div>
    </div>

    <button class="go" id="refill-go" type="button">推算預估藥物用完日</button>
  </div>
  <div id="refill-result" aria-live="polite"></div>

  <p class="sheet-link">
    要印給診間的整張回診日期表 → <a href="./sheet.html">今日回診日期表</a>
  </p>

  <footer class="foot">
    單一檔案、離線可用<br>推算結果為排程輔助，實際處方與健保規定仍以你的臨床判斷為準
  </footer>
</div>

<script>
(function(){
  "use strict";
  var WD = ["週日","週一","週二","週三","週四","週五","週六"];
  var DOW = ["日","一","二","三","四","五","六"];

  /* ---------- 日期工具 ---------- */
  function today(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
  function pad(n){ return (n<10?"0":"")+n; }
  function addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); }
  function fullDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function sameDay(a,b){
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }
  function rocFull(d){
    return "民國"+(d.getFullYear()-1911)+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
  }

  /* ---------- 狀態 ---------- */
  var sel = today();                 // 選定的處方起始日（預設今天）
  var viewY = sel.getFullYear();     // 月曆目前顯示的年月
  var viewM = sel.getMonth();
  var refillUnit = "week";           // "week" | "day"
  var refillNum = 12;                // 預設 12 週 = 84 天
  var computed = false;              // 按過一次推算後，改任何條件即時重算
  var QUICK = { week:[2,4,6,8,12,13], day:[28,30,56,60,84,90,180] };

  /* ---------- 月曆 ---------- */
  function renderCal(){
    document.getElementById("cal-title").textContent = viewY+"年"+(viewM+1)+"月";
    var g=document.getElementById("cal-grid"); g.innerHTML="";
    DOW.forEach(function(w){
      var s=document.createElement("div"); s.className="cal-dow"; s.textContent=w; g.appendChild(s);
    });
    var first=new Date(viewY,viewM,1);
    for(var i=0;i<first.getDay();i++){
      var b=document.createElement("div"); b.className="cal-blank"; g.appendChild(b);
    }
    var days=new Date(viewY,viewM+1,0).getDate();
    var t=today();
    for(var d=1; d<=days; d++){
      (function(d){
        var cur=new Date(viewY,viewM,d);
        var cell=document.createElement("button");
        cell.type="button"; cell.className="cal-day";
        if(sameDay(cur,t)) cell.classList.add("is-today");
        if(sameDay(cur,sel)) cell.classList.add("is-sel");
        cell.textContent=d;
        cell.setAttribute("aria-label", viewY+"年"+(viewM+1)+"月"+d+"日"+WD[cur.getDay()]);
        cell.addEventListener("click",function(){
          sel=cur; renderCal(); afterChange();
        });
        g.appendChild(cell);
      })(d);
    }
    updatePicked();
  }
  function updatePicked(){
    var el=document.getElementById("cal-picked");
    el.innerHTML='起始日 <em>'+fullDate(sel)+'（'+WD[sel.getDay()]+'）</em>'+
      (sameDay(sel,today())?'<span class="today-badge">今天</span>':'');
  }
  function moveMonth(dy,dm){
    var m=viewM+dm, y=viewY+dy;
    if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
    viewY=y; viewM=m; renderCal();
  }
  function goToday(){
    sel=today(); viewY=sel.getFullYear(); viewM=sel.getMonth();
    renderCal(); afterChange();
  }

  /* ---------- 間隔快捷 ---------- */
  function renderQuick(){
    var c=document.getElementById("refill-quick"); c.innerHTML="";
    QUICK[refillUnit].forEach(function(v){
      var b=document.createElement("button");
      b.type="button"; b.className="chip chip-num"+(v===refillNum?" is-active":"");
      b.setAttribute("data-val", v);
      b.textContent = v + (refillUnit==="week"?" 週":" 天");
      b.addEventListener("click",function(){
        refillNum=v;
        document.getElementById("refill-num").value=v;
        c.querySelectorAll(".chip").forEach(function(x){ x.classList.remove("is-active"); });
        b.classList.add("is-active");
        afterChange();
      });
      c.appendChild(b);
    });
  }
  function setRefillUnit(u){
    refillUnit=u;
    document.querySelectorAll("#refill-unit .seg-btn").forEach(function(b){
      b.classList.toggle("is-active", b.getAttribute("data-unit")===u);
    });
    document.getElementById("refill-unit-suffix").textContent = u==="week"?"週":"天";
    renderQuick();
    afterChange();
  }
  function syncQuickHighlight(){
    document.querySelectorAll("#refill-quick .chip").forEach(function(x){
      x.classList.toggle("is-active", +x.getAttribute("data-val")===refillNum);
    });
  }

  /* ---------- 推算 ---------- */
  function emptyState(msg){
    return '<div class="result"><div class="empty">'+msg+'</div></div>';
  }
  function renderRefill(){
    computed=true;
    var box=document.getElementById("refill-result");
    var num=parseInt(document.getElementById("refill-num").value,10)||0;
    refillNum=num;
    var total = refillUnit==="week" ? num*7 : num;
    if(!total||total<1){ box.innerHTML=emptyState("請輸入有效的回診間隔。"); return; }
    var spanLabel = refillUnit==="week" ? ("+"+num+" 週（"+total+" 天）") : ("+"+total+" 天");
    var runout=addDays(sel,total); // 起始日 + 間隔 = 預估藥物用完日
    box.innerHTML='<div class="result"><div class="result-head">'+
      '<span class="target-label">預估藥物用完日</span>'+
      '<span class="target-date">'+fullDate(runout)+'（'+WD[runout.getDay()]+'）</span>'+
      '<span class="target-meta">'+rocFull(runout)+'<br>從 '+fullDate(sel)+'（'+WD[sel.getDay()]+'）起算 '+spanLabel+'</span>'+
    '</div></div>';
  }
  function afterChange(){ if(computed) renderRefill(); }

  /* ---------- 初始化 ---------- */
  function init(){
    renderCal();
    document.getElementById("cal-prev-y").addEventListener("click",function(){ moveMonth(-1,0); });
    document.getElementById("cal-next-y").addEventListener("click",function(){ moveMonth(1,0); });
    document.getElementById("cal-prev-m").addEventListener("click",function(){ moveMonth(0,-1); });
    document.getElementById("cal-next-m").addEventListener("click",function(){ moveMonth(0,1); });
    document.getElementById("cal-today").addEventListener("click",goToday);

    document.querySelectorAll("#refill-unit .seg-btn").forEach(function(b){
      b.addEventListener("click",function(){ setRefillUnit(b.getAttribute("data-unit")); });
    });
    document.getElementById("refill-num").addEventListener("input",function(){
      refillNum=parseInt(this.value,10)||0; syncQuickHighlight(); afterChange();
    });
    renderQuick();

    document.getElementById("refill-go").addEventListener("click",renderRefill);
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
  else init();
})();
</script>

<!-- PWA：註冊離線小管家 -->
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(e){ console.log("SW register failed:", e); });
  });
}
</script>
</body>
</html>
